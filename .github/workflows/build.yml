        uses: actions/upload-artifact@v4
        with:
          name: PortCheck-macOS-ARM64
          path: dist/PortCheck

  # ── 发布 Release ─────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-x64, linux-arm64, macos-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PortCheck-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
