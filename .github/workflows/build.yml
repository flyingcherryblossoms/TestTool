name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Windows x64 ──────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name TestTool `
            --icon=resources/icon.ico `
            --add-data "resources/icon.ico;resources" `
            --clean --noconfirm main.py

      - name: Package
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path TestTool.exe -DestinationPath TestTool-Windows-x64.zip
          (Get-FileHash TestTool-Windows-x64.zip -Algorithm SHA256).Hash + "  TestTool-Windows-x64.zip" |
            Out-File -Encoding ASCII TestTool-Windows-x64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-Windows-x64
          path: |
            dist/TestTool-Windows-x64.zip
            dist/TestTool-Windows-x64.zip.sha256

  # ── Linux x64 ────────────────────────────────────────────
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0

      - name: Install Python deps
        run: pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name TestTool \
            --add-data "resources/icon.png:resources" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf TestTool-Linux-x64.tar.gz TestTool
          sha256sum TestTool-Linux-x64.tar.gz > TestTool-Linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-Linux-x64
          path: |
            dist/TestTool-Linux-x64.tar.gz
            dist/TestTool-Linux-x64.tar.gz.sha256

  # ── Linux x64 兼容版 (glibc 2.27+, Python 3.8) ───────────
  linux-x64-compat:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common gnupg wget
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq python3.8 python3.8-venv python3.8-dev python3.8-distutils
          apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 binutils
          apt-get install -y -qq libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libx11-xcb1 libfontconfig1 libfreetype6
          wget -q https://bootstrap.pypa.io/pip/3.8/get-pip.py -O /tmp/get-pip.py
          python3.8 /tmp/get-pip.py -q

      - name: Install Python deps
        run: python3.8 -m pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          QT_PLUGINS=$(python3.8 -c "import PySide6,os;print(os.path.join(os.path.dirname(PySide6.__file__),'Qt','plugins'))")
          python3.8 -m PyInstaller --onefile --name TestTool \
            --add-data "resources/icon.png:resources" \
            --add-data "${QT_PLUGINS}/platforms:PySide6/Qt/plugins/platforms" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf TestTool-Linux-x64-compat.tar.gz TestTool
          sha256sum TestTool-Linux-x64-compat.tar.gz > TestTool-Linux-x64-compat.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-Linux-x64-compat
          path: |
            dist/TestTool-Linux-x64-compat.tar.gz
            dist/TestTool-Linux-x64-compat.tar.gz.sha256

  # ── Linux ARM64 ──────────────────────────────────────────
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0

      - name: Install Python deps
        run: pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name TestTool \
            --add-data "resources/icon.png:resources" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf TestTool-Linux-ARM64.tar.gz TestTool
          sha256sum TestTool-Linux-ARM64.tar.gz > TestTool-Linux-ARM64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-Linux-ARM64
          path: |
            dist/TestTool-Linux-ARM64.tar.gz
            dist/TestTool-Linux-ARM64.tar.gz.sha256

  # ── Linux ARM64 兼容版 (glibc 2.27+, Python 3.8) ─────────
  linux-arm64-compat:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common gnupg wget
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq python3.8 python3.8-venv python3.8-dev python3.8-distutils
          apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 binutils
          apt-get install -y -qq libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libx11-xcb1 libfontconfig1 libfreetype6
          wget -q https://bootstrap.pypa.io/pip/3.8/get-pip.py -O /tmp/get-pip.py
          python3.8 /tmp/get-pip.py -q

      - name: Install Python deps
        run: python3.8 -m pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          QT_PLUGINS=$(python3.8 -c "import PySide6,os;print(os.path.join(os.path.dirname(PySide6.__file__),'Qt','plugins'))")
          python3.8 -m PyInstaller --onefile --name TestTool \
            --add-data "resources/icon.png:resources" \
            --add-data "${QT_PLUGINS}/platforms:PySide6/Qt/plugins/platforms" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf TestTool-Linux-ARM64-compat.tar.gz TestTool
          sha256sum TestTool-Linux-ARM64-compat.tar.gz > TestTool-Linux-ARM64-compat.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-Linux-ARM64-compat
          path: |
            dist/TestTool-Linux-ARM64-compat.tar.gz
            dist/TestTool-Linux-ARM64-compat.tar.gz.sha256

  # ── macOS ARM64 ──────────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install PySide6 openpyxl xlrd websocket-client websockets pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name TestTool \
            --add-data "resources/icon.png:resources" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf TestTool-macOS-ARM64.tar.gz TestTool
          shasum -a 256 TestTool-macOS-ARM64.tar.gz > TestTool-macOS-ARM64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestTool-macOS-ARM64
          path: |
            dist/TestTool-macOS-ARM64.tar.gz
            dist/TestTool-macOS-ARM64.tar.gz.sha256

  # ── 发布 Release ─────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-x64, linux-x64-compat, linux-arm64, linux-arm64-compat, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TestTool-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
