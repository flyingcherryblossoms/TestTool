          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq python3.8 python3.8-venv python3.8-dev python3.8-distutils
          apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 binutils
          apt-get install -y -qq libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libx11-xcb1 libfontconfig1 libfreetype6
