    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0

      - name: Install Python deps
        run: pip install PySide6 openpyxl xlrd Pillow pyinstaller

      - name: Generate icon
        shell: python
        run: |
          from PIL import Image, ImageDraw
