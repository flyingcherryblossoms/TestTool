          pyinstaller --onefile --windowed --name PortCheck \
            --add-data "portcheck/icon.png:portcheck" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf PortCheck-macOS-ARM64.tar.gz PortCheck
          shasum -a 256 PortCheck-macOS-ARM64.tar.gz > PortCheck-macOS-ARM64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheck-macOS-ARM64
          path: |
            dist/PortCheck-macOS-ARM64.tar.gz
            dist/PortCheck-macOS-ARM64.tar.gz.sha256

  # ── 发布 Release ─────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-x64, linux-x64-compat, linux-arm64, linux-arm64-compat, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PortCheck-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
