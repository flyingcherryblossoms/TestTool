name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Windows x64 ──────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PySide6 openpyxl xlrd Pillow pyinstaller

      - name: Generate icon
        shell: python
        run: |
          from PIL import Image, ImageDraw
          s=256;m=s/2
          img=Image.new('RGBA',(s,s),(0,0,0,0))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle([0,0,s-1,s-1],radius=s//5,fill='#1a5276')
          pad=int(s*0.15)
          d.rounded_rectangle([pad,pad,s-pad,s-pad],radius=s//6,fill='#2980b9')
          cx,cy,nr=m,m*0.88,int(s*0.07)
          nodes=[(cx,int(cy-s*0.22)),(int(cx-s*0.2),int(cy+s*0.12)),(int(cx+s*0.2),int(cy+s*0.12))]
          for i in range(3):
           for j in range(i+1,3):d.line([nodes[i],nodes[j]],fill='#aed6f1',width=5)
          for nx,ny in nodes:d.ellipse([nx-nr,ny-nr,nx+nr,ny+nr],fill='#ecf0f1')
          tx,ty,ts=int(m+s*0.22),int(m+s*0.22),s*0.26
          p1,p2,p3=(tx-int(ts*0.45),ty-int(ts*0.05)),(tx-int(ts*0.05),ty+int(ts*0.35)),(tx+int(ts*0.5),ty-int(ts*0.3))
          d.line([p1,p2,p3],fill='#2ecc71',width=10,joint='curve')
          img.save('portcheck/icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(256,256)])

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name PortCheck `
            --icon=portcheck/icon.ico `
            --add-data "portcheck/icon.ico;portcheck" `
            --clean --noconfirm main.py

      - name: Package
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path PortCheck.exe -DestinationPath PortCheck-Windows-x64.zip
          (Get-FileHash PortCheck-Windows-x64.zip -Algorithm SHA256).Hash + "  PortCheck-Windows-x64.zip" |
            Out-File -Encoding ASCII PortCheck-Windows-x64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheck-Windows-x64
          path: |
            dist/PortCheck-Windows-x64.zip
            dist/PortCheck-Windows-x64.zip.sha256

  # ── Linux x64 ────────────────────────────────────────────
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0

      - name: Install Python deps
        run: pip install PySide6 openpyxl xlrd Pillow pyinstaller

      - name: Generate icon
        shell: python
        run: |
          from PIL import Image, ImageDraw
          s=256;m=s/2
          img=Image.new('RGBA',(s,s),(0,0,0,0))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle([0,0,s-1,s-1],radius=s//5,fill='#1a5276')
          pad=int(s*0.15)
          d.rounded_rectangle([pad,pad,s-pad,s-pad],radius=s//6,fill='#2980b9')
          cx,cy,nr=m,m*0.88,int(s*0.07)
          nodes=[(cx,int(cy-s*0.22)),(int(cx-s*0.2),int(cy+s*0.12)),(int(cx+s*0.2),int(cy+s*0.12))]
          for i in range(3):
           for j in range(i+1,3):d.line([nodes[i],nodes[j]],fill='#aed6f1',width=5)
          for nx,ny in nodes:d.ellipse([nx-nr,ny-nr,nx+nr,ny+nr],fill='#ecf0f1')
          tx,ty,ts=int(m+s*0.22),int(m+s*0.22),s*0.26
          p1,p2,p3=(tx-int(ts*0.45),ty-int(ts*0.05)),(tx-int(ts*0.05),ty+int(ts*0.35)),(tx+int(ts*0.5),ty-int(ts*0.3))
          d.line([p1,p2,p3],fill='#2ecc71',width=10,joint='curve')
          img.save('portcheck/icon.png')

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name PortCheck \
            --add-data "portcheck/icon.png:portcheck" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf PortCheck-Linux-x64.tar.gz PortCheck
          sha256sum PortCheck-Linux-x64.tar.gz > PortCheck-Linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheck-Linux-x64
          path: |
            dist/PortCheck-Linux-x64.tar.gz
            dist/PortCheck-Linux-x64.tar.gz.sha256

  # ── Linux x64 兼容版 (glibc 2.27+, Python 3.8) ───────────
  linux-x64-compat:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common gnupg wget
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq python3.8 python3.8-venv python3.8-dev python3.8-distutils
          apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 binutils
          apt-get install -y -qq libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libx11-xcb1 libfontconfig1 libfreetype6
          wget -q https://bootstrap.pypa.io/pip/3.8/get-pip.py -O /tmp/get-pip.py
          python3.8 /tmp/get-pip.py -q

      - name: Install Python deps
        run: python3.8 -m pip install PySide6 openpyxl xlrd Pillow pyinstaller

      - name: Generate icon
        run: |
          python3.8 -c "
          from PIL import Image, ImageDraw
          s=256;m=s/2
          img=Image.new('RGBA',(s,s),(0,0,0,0))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle([0,0,s-1,s-1],radius=s//5,fill='#1a5276')
          pad=int(s*0.15)
          d.rounded_rectangle([pad,pad,s-pad,s-pad],radius=s//6,fill='#2980b9')
          cx,cy,nr=m,m*0.88,int(s*0.07)
          nodes=[(cx,int(cy-s*0.22)),(int(cx-s*0.2),int(cy+s*0.12)),(int(cx+s*0.2),int(cy+s*0.12))]
          for i in range(3):
           for j in range(i+1,3):d.line([nodes[i],nodes[j]],fill='#aed6f1',width=5)
          for nx,ny in nodes:d.ellipse([nx-nr,ny-nr,nx+nr,ny+nr],fill='#ecf0f1')
          tx,ty,ts=int(m+s*0.22),int(m+s*0.22),s*0.26
          p1,p2,p3=(tx-int(ts*0.45),ty-int(ts*0.05)),(tx-int(ts*0.05),ty+int(ts*0.35)),(tx+int(ts*0.5),ty-int(ts*0.3))
          d.line([p1,p2,p3],fill='#2ecc71',width=10,joint='curve')
          img.save('portcheck/icon.png')
          "

      - name: Build
        run: |
          python3.8 -m PyInstaller --onefile --windowed --name PortCheck \
            --add-data "portcheck/icon.png:portcheck" \
            --clean --noconfirm main.py

      - name: Package
        run: |
          cd dist
          tar czf PortCheck-Linux-x64-compat.tar.gz PortCheck
          sha256sum PortCheck-Linux-x64-compat.tar.gz > PortCheck-Linux-x64-compat.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortCheck-Linux-x64-compat
          path: |
            dist/PortCheck-Linux-x64-compat.tar.gz
            dist/PortCheck-Linux-x64-compat.tar.gz.sha256

  # ── Linux ARM64 ──────────────────────────────────────────
  linux-arm64:
    runs-on: ubuntu-24.04-arm
